name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: usage
    attributes:
      label: 使用场景
      description: 你想解决什么问题？在什么场景下需要这个能力？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 希望怎么实现？接口、配置项、面板展示都可以描述。
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 替代方案
      description: 是否考虑过其他做法，它们有什么不足？
    validations:
      required: false
