# deepseek-relay 的 nginx 入口。对照现网那份的三处修改都标了 [FIX]。
# 放 /etc/nginx/conf.d/relay.conf，然后 nginx -t && systemctl reload nginx

map $http_x_forwarded_for $relay_realip {
    default $remote_addr;
    ~^([0-9a-fA-F.:]+),* $1;
}

upstream deepseek_relay {
    server 127.0.0.1:8790 max_fails=0;   # 健康判断交给网关自己，nginx 不再瞎摘
    keepalive 16;
}

server {
    listen 8789;                          # 对外入口；网关仍在 127.0.0.1:8790
    server_name _;

    access_log /var/log/nginx/relay.access.log;
    error_log  /var/log/nginx/relay.error.log warn;

    # [FIX] 现网那份是 rate=2r/s + burst=8 + limit_req_status 429，
    #       实测 15 连击 /healthz 就打出 6 个 429（HTML），客户端表现为"无法返回上游"。
    #       这里只留一个真正兜底的限流（每 IP 60r/s），并且 429 回 JSON。
    limit_req_zone $relay_realip zone=relay_ip:10m rate=60r/s;

    # [FIX] 限流响应必须是 JSON，不能是 nginx 默认的 HTML 页
    error_page 429 = @relay429;
    limit_req_status 429;
    location @relay429 {
        default_type application/json;
        return 429 '{"error":{"message":"edge rate limit (nginx), slow down","type":"relay_error","code":"rpm"},"relay":{"hint":"这一条来自 nginx 边缘限流，不是上游 DeepSeek"}}';
    }

    location / {
        limit_req zone=relay_ip burst=120 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $relay_realip;
        proxy_set_header X-Forwarded-For   $relay_realip;   # [FIX] 只传一个可信的真实 IP

        # [FIX] SSE 三件套：不缓冲、不缓存、读超时给足
        proxy_buffering    off;
        proxy_cache        off;
        proxy_request_buffering off;
        add_header X-Accel-Buffering no always;
        proxy_connect_timeout 10s;
        proxy_send_timeout    360s;
        proxy_read_timeout    360s;

        proxy_pass http://deepseek_relay;
    }

    # [FIX] 观测面收到内网。现网 ds2api 的 /admin 直接公网可达（P0），别再犯同样的错
    location /relay/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://deepseek_relay;
    }
}